name: Deploy codeassuranceindex.info

# Mirrors the watchdog deploy: a self-hosted runner ON canine-wrx1 verifies the build, publishes the app + rubrics to
# /home/jimmy/apps/cai-web, then bounces cai-web.service (~1s). VERIFY before stopping anything, so a broken build is a
# safe no-op. SSL is terminated by nginx on canine-dgx1 (unchanged by a code deploy).
#
# Requires a self-hosted runner registered for CanineCC/CAI on canine-wrx1 (label: self-hosted). The systemd unit +
# nginx vhost live in deploy/ for reference.
on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "rubrics/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-cai-main
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  # The runner host (canine-wrx1) is shared with the watchdog scan fleet; .NET Server GC under that
  # contention intermittently aborts the runtime (Internal CLR error 0x80131506, exit 134).
  # Workstation GC + tiered-JIT off shrink the footprint — same mitigation as the watchdog, kennel
  # and imprint deploy workflows. Paired with -m:1 /p:UseSharedCompilation=false on the
  # build/test/publish invocations below.
  DOTNET_gcServer: "0"
  DOTNET_TieredCompilation: "0"
  DOTNET_TieredPGO: "0"

permissions:
  # ★ Write, because the deploy COMMITS BACK the public key this host generated — see "Publish the signing key"
  #   below. Nothing else in the workflow writes to the repository.
  contents: write

jobs:
  deploy:
    runs-on: self-hosted
    # Bind to a named deployment environment so the run is traceable and can gate behind required reviewers /
    # protection rules (configure them in repo Settings → Environments). With no rules it deploys straight through.
    environment:
      name: production
      url: https://codeassuranceindex.info
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # ★★ SIGN THE CORPUS FIRST, on this host, with a key that never leaves it — BEFORE the build and the tests,
      # because the tests verify the signature and nobody outside this box has the key. Signing later would mean a
      # manifest edited anywhere else could never pass CI at all.
      #
      # ★★ Deliberately NOT an API endpoint. An endpoint that can sign means whoever can call it can re-sign a
      # TAMPERED corpus, and the thing doing the verifying becomes the thing being checked. Here no request can
      # reach the key, and the signature is produced by the deploy that ships the artifact.
      #
      # ★ The key is generated on first run and then reused from registry-data/, which a deploy never replaces —
      # so a new host provisions itself instead of waiting for somebody to remember a manual step.
      - name: Sign the noise corpus
        run: tools/sign-corpus.sh
        env:
          CAI_CORPUS_SIGNING_KEY: /home/jimmy/apps/cai-web/registry-data/cai-corpus.key.pem

      # ★★ THE REPOSITORY AND THE SITE MUST AGREE ON THE KEY. The signing key is generated on this host on its
      # first run, so the .pub.pem and .sig committed before that were signed by a placeholder key nobody has —
      # and VERIFYING-THE-CORPUS.md tells a third party that "this directory holds everything needed". Left
      # alone, anyone cross-checking the published corpus against GitHub would get a Verification Failure and no
      # way to tell a key rotation from a tampered manifest.
      #
      # ★★ ONLY WHEN THE PUBLIC KEY CHANGED, which is first-run and rotation and nothing else. ECDSA signatures
      # are randomised, so the .sig differs on every run even over identical bytes — committing that would put a
      # commit on main after every deploy. Gated on the key, both files go together, so the committed pair stays
      # internally consistent and verifies.
      #
      # ★ [skip ci] because the corpus lives under src/**, which is in this workflow's own path filter: without
      # it the commit would trigger the deploy that produced it.
      #
      # ★ A failed push WARNS rather than failing the deploy. The site is already correct at this point; the
      # repository lagging by one file is a documentation defect, not a broken release.
      - name: Publish the signing key this host generated
        run: |
          set -euo pipefail
          if git diff --quiet -- src/Cai.Web/Noise/corpus/'*.pub.pem'; then
            echo "public key unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "cai-deploy"
          git config user.email "deploy@codeassuranceindex.info"
          git add src/Cai.Web/Noise/corpus/*.pub.pem src/Cai.Web/Noise/corpus/*.json.sig
          git commit -m "chore(corpus): publish the signing key this host generated [skip ci]"
          if ! git push origin HEAD:main; then
            echo "::warning::could not push the new public key — the SITE is signed correctly, but the "\
                 "repository copy is stale. Re-run this workflow or commit src/Cai.Web/Noise/corpus/ by hand."
          fi

      # ★★ THE OTHER HALF OF THE SEPARATION. deploy-preprod.yml rewrites the corpus in ITS checkout to a
      #    preprod one — own key id, own dates, embargo open — so that preprod can rehearse the whole standard
      #    without touching anything here. That transformation must never travel in this direction.
      #
      #    It cannot today: the two workflows check out independently and preprod has `contents: read`, so it
      #    cannot commit its transformed corpus back. This asserts it anyway, because "cannot happen" is a
      #    claim about a workflow file that somebody will edit, and the failure it prevents is publishing a
      #    holdout with preprod's dates and a key nobody outside the box holds — under the production name,
      #    to an audience whose whole reason for trusting it is that it is checkable.
      - name: The corpus about to ship is the PUBLISHED one, not preprod's
        run: |
          set -euo pipefail
          id=$(python3 -c 'import json;print(json.load(open("src/Cai.Web/Noise/corpus/noise-corpus-1.0.json"))["keyId"])')
          echo "corpus keyId: $id"
          case "$id" in
            *preprod*) echo "::error::production is about to ship the PREPROD corpus ('$id'). Refusing."; exit 1 ;;
          esac

      # VERIFY (the old service keeps serving; any failure here = safe no-op).
      - name: Verify build (Release)
        run: dotnet build src/Cai.Web -c Release -m:1 /p:UseSharedCompilation=false

      - name: Test the scorer
        run: dotnet test tests/Cai.Tests -c Release -m:1 /p:UseSharedCompilation=false

      # PUBLISH into a staging dir, sync the rubrics, swap, bounce.
      # registry-data/ is the registry's STABLE store (SQLite db + trusted keys — see
      # deploy/registry/DEPLOY.md); it lives NEXT to the swapped app dir so a deploy never touches it.
      - name: Publish
        run: |
          set -euo pipefail
          mkdir -p /home/jimmy/apps/cai-web/registry-data
          rm -rf /home/jimmy/apps/cai-web/app.next
          dotnet publish src/Cai.Web -c Release -m:1 /p:UseSharedCompilation=false -o /home/jimmy/apps/cai-web/app.next
          rsync -a --delete rubrics/ /home/jimmy/apps/cai-web/rubrics/
          rm -rf /home/jimmy/apps/cai-web/app.prev
          [ -d /home/jimmy/apps/cai-web/app ] && mv /home/jimmy/apps/cai-web/app /home/jimmy/apps/cai-web/app.prev || true
          mv /home/jimmy/apps/cai-web/app.next /home/jimmy/apps/cai-web/app
          sudo systemctl restart cai-web.service

      - name: Health check (roll back on failure)
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/health || true)
            [ "$code" = "200" ] && { echo "cai-web healthy"; exit 0; }
            sleep 1
          done
          echo "::error::cai-web did not come healthy — rolling back"
          [ -d /home/jimmy/apps/cai-web/app.prev ] && { rm -rf /home/jimmy/apps/cai-web/app; mv /home/jimmy/apps/cai-web/app.prev /home/jimmy/apps/cai-web/app; sudo systemctl restart cai-web.service; }
          exit 1

      # Advisory registry probe (api.codeassuranceindex.info rides this same service). Warn-only until the
      # registry endpoints are merged + configured — /health above stays the rollback gate.
      - name: Registry probe (advisory)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/api/registry/keys || true)
          if [ "$code" = "200" ]; then echo "registry serving (/api/registry/keys 200)"; else
            echo "::warning::/api/registry/keys returned $code — registry not live yet (expected until the registry context ships + keys are provisioned)"
          fi

  # ---------- THE STANDARD MUST ACTUALLY SERVE ----------
  # ★★ /health IS NOT A TEST OF THE STANDARD. It answers 200 from a process that has started, and the noise
  #    endpoints load the SIGNED CORPUS lazily on first request — so a corpus that cannot be read takes out
  #    /api/noise/* completely while /health stays green and the deploy goes out reporting success.
  #
  #    That is not hypothetical. On 2026-08-21 the production noise API was found returning 500 on every
  #    endpoint, and the last deploy had been three days earlier, green. Nobody had looked, because nothing
  #    looked. The preprod workflow got this check the same morning; production, which is the one that
  #    matters, did not have it.
  #
  # ★ A SEPARATE JOB, `needs: deploy`, so it reddens the run WITHOUT rolling back. Rolling back on this would
  #   swap in the previous build, which — when the fault is in the corpus or its embedding rather than in the
  #   new code — is broken in exactly the same way. Red and shipped beats green and silent; churn beats
  #   neither.
  #
  # ★ It distinguishes the two failure shapes on purpose, because they have different fixes: a 503 is the
  #   signature failing to verify (fail-closed, working as designed, re-sign), a 500 is an UNHANDLED
  #   exception — LoadCore catches only CryptographicException, so anything else reaching it lands here.
  #
  # ★★ AND IT DELIBERATELY DOES NOT GUESS THE CAUSE OF A 500. The first version of this line asserted "almost
  #    certainly a corpus resource that was not embedded", reasoning from the one unhandled throw in OUR code.
  #    The first real 500 was nothing of the kind: unattended-upgrades replaced dotnet-runtime-10.0 underneath
  #    a RUNNING process and deleted the shared-framework directory it was mapped to, so the assembly load
  #    inside Verify() — System.Formats.Asn1, reached only on this path — threw FileNotFoundException. The
  #    runtime can throw here too, and a hint that names one cause sends the next reader past the real one.
  #
  # ★★ NOTE WHAT THIS GATE CANNOT SEE. That break happened BETWEEN deploys, with no deploy running, and the
  #    Lazy<T> cached the exception so it stayed broken until a restart. A deploy-time check is structurally
  #    blind to it. The fix for that class is not here — it is restarting long-running .NET services when the
  #    runtime is upgraded under them.
  verify-noise-api:
    needs: deploy
    runs-on: self-hosted
    steps:
      - name: The noise standard serves its own documents
        run: |
          set -uo pipefail
          bad=0
          for path in /api/noise/method /api/noise/corpus /api/noise/verdicts; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://127.0.0.1:8090$path" || echo 000)
            printf '%-26s HTTP %s\n' "$path" "$code"
            [ "$code" = "200" ] && continue
            bad=1
            case "$code" in
              503) echo "::error::$path 503 — the corpus signature does not verify. This is the fail-closed path working. Re-run this deploy: it re-signs on the box before publishing." ;;
              500) echo "::error::$path 500 — UNHANDLED inside CorpusManifest.LoadCore, which catches only CryptographicException. READ THE EXCEPTION; do not assume the cause: journalctl -u cai-web -n 200 --no-pager | grep -B5 -A20 CorpusManifest" ;;
              *)   echo "::error::$path answered $code" ;;
            esac
          done
          exit "$bad"
