name: publish-packages

# Publishes the CAI reference implementation — Cai.Scoring (the deterministic fold) and Cai.Delivery (the
# Ed25519 signer/verifier) — so ANY consumer can recompute and verify a CAI with the same code that produced it.
#
# Why nuget.org and not only GitHub Packages: GitHub Packages requires an authenticated GitHub account even for
# public feeds, so "the reference scorer is open, go check our number" was not actually true for an anonymous
# third party. nuget.org is anonymous. GitHub Packages is kept as a mirror.
#
# Trigger by pushing a tag like `packages-v0.1.3` (version taken from the tag), or run manually.
# `scoring-v*` is still honoured for backwards compatibility with the old publish-scoring workflow.
#
# Required repository secret: NUGET_API_KEY (nuget.org push key). If absent the nuget.org step is skipped with a
# warning rather than failing the run, so the GitHub Packages mirror still publishes.

on:
  push:
    tags: ['packages-v*', 'scoring-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 0.1.3)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: ver
        # ★★ BOTH SOURCES ARE ATTACKER-CHOSEN. A dispatch input is whatever was typed, and a tag name only has
        #    to satisfy git's ref rules, which permit `$`, a backtick, `;`, `|` and `&`. Actions expands ${{ }}
        #    BEFORE the shell exists, so interpolating either one into this script would write those characters
        #    in as code, in a job that holds the publish keys. Bound to env: instead, read as shell variables.
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            v="$DISPATCH_VERSION"
          else
            v="${GITHUB_REF_NAME#*-v}"
          fi
          # ★ And validated to a shape before it leaves this step, so every later step consumes a known token
          #   rather than an arbitrary string that merely travelled through $GITHUB_OUTPUT.
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::could not resolve a semantic version (got '$v')"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Publishing version $v"

      - name: Verify the packaged version matches the csproj
        # Guards the failure mode this workflow exists to fix: shipping a package whose version does not
        # correspond to any source the public can read.
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          for p in src/Cai.Scoring/Cai.Scoring.csproj src/Cai.Delivery/Cai.Delivery.csproj; do
            declared=$(grep -oPm1 '(?<=<Version>)[^<]+' "$p")
            if [ "$declared" != "$VERSION" ]; then
              echo "::error::$p declares <Version>$declared</Version> but the tag asks for $VERSION."
              exit 1
            fi
          done

      - name: Test
        run: dotnet test tests/Cai.Tests/Cai.Tests.csproj -c Release --nologo

      - name: Pack
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          dotnet pack src/Cai.Scoring/Cai.Scoring.csproj  -c Release -o nupkg "-p:Version=$VERSION"
          dotnet pack src/Cai.Delivery/Cai.Delivery.csproj -c Release -o nupkg "-p:Version=$VERSION"

      - name: Push to nuget.org (anonymous-readable)
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::warning::NUGET_API_KEY is not set — skipping nuget.org. The reference implementation will NOT be anonymously installable until this secret is configured."
            exit 0
          fi
          dotnet nuget push "nupkg/*.nupkg" \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: Push to GitHub Packages (mirror)
        # ★★ The token reaches the process as DATA. Interpolated into the script it would be written literally
        #    into the step's script file on the runner's disk, and would surface in any shell trace, `ps`
        #    listing or echoed failing command — none of which log masking covers.
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dotnet nuget push "nupkg/*.nupkg" \
            --source "https://nuget.pkg.github.com/CanineCC/index.json" \
            --api-key "$GH_PACKAGES_TOKEN" \
            --skip-duplicate

      - name: Upload packages as build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cai-packages-${{ steps.ver.outputs.version }}
          path: nupkg/*
