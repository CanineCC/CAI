# dgx1 TLS edge vhost — app.codeassuranceindex.info → canine-wrx1 :8090 (the SAME cai-web service
# as the api host; a third hostname on the existing backend, not a new service).
#
# Why this hostname exists. The apex serves the MARKETING site (imprint CMS), so the app's own
# interactive pages are unreachable there: codeassuranceindex.info/calculator returns "Page not
# found" even though Cai.Web renders it, because that host never reaches the app — only /api/*,
# /glossary.jsonld and /schemas/ do. The tools that make the standard checkable (the calculator, and
# the verifier that reproduces a headline and checks an Ed25519 delivery signature) would otherwise
# be deployed but unlinkable.
#
# This is the same split watchdog uses (watchdog.canine.dev = marketing, app.watchdog.canine.dev =
# the app). Replaces app.cai.canine.dev. This file is a copy of what is installed and live.
# Install: /etc/nginx/sites-available/app.codeassuranceindex.info + symlink into sites-enabled.
# Cert (webroot):
#   sudo certbot certonly --webroot -w /var/www/html -d app.codeassuranceindex.info
server {
    listen 80;
    listen [::]:80;
    server_name app.codeassuranceindex.info;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.codeassuranceindex.info;
    ssl_certificate /etc/letsencrypt/live/app.codeassuranceindex.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.codeassuranceindex.info/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # The verifier takes a pasted delivery package (full evidence JSON) as a form post.
    client_max_body_size 16m;
    location / {
        proxy_pass http://192.168.1.10:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120;
    }
}
