# dgx1 TLS edge vhost — codeassuranceindex.info (+ www) — the standard's own domain, replacing
# cai.canine.dev. This file is a copy of what is installed and live; it is NO LONGER stale.
#
# The apex is a SPLIT host, which is the thing the previous version of this file got wrong:
#   • /                     → the imprint-published marketing site (canine-wrx1 :8153). Imprint owns
#                             this content; the pages here are authored, not rendered by Cai.Web.
#   • /api/                 → Cai.Web (:8090), kept SAME-ORIGIN so the marketing widgets (verifier,
#                             calculator, dimensions) call the API without needing a CORS grant.
#   • /glossary.jsonld      → Cai.Web, so the JSON-LD identifier resolves on the domain that owns it.
#   • /schemas/             → Cai.Web, so the signed package's $schema URL resolves likewise.
# www 301s to the apex, the estate convention (see canine.dev).
#
# Install: /etc/nginx/sites-available/codeassuranceindex.info + symlink into sites-enabled.
# Cert (webroot): sudo certbot certonly --webroot -w /var/www/html \
#                   -d codeassuranceindex.info -d www.codeassuranceindex.info
server {
    listen 80;
    listen [::]:80;
    server_name codeassuranceindex.info www.codeassuranceindex.info;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://codeassuranceindex.info$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.codeassuranceindex.info;
    ssl_certificate /etc/letsencrypt/live/codeassuranceindex.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codeassuranceindex.info/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp-report-only.conf;
    return 301 https://codeassuranceindex.info$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name codeassuranceindex.info;
    ssl_certificate /etc/letsencrypt/live/codeassuranceindex.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codeassuranceindex.info/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/csp-report-only.conf;
    client_max_body_size 16m;

    # Open API surface — transparent proxy to cai-web (programmatic callers; NEVER redirect).
    location /api/ {
        proxy_pass http://192.168.1.10:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120;
    }

    # The standard's machine identifiers, served by Cai.Web so the URLs the signed package
    # and the JSON-LD name actually resolve on the domain that owns them (they 404 on the
    # static site, which knows nothing about schemas or the glossary).
    location = /glossary.jsonld { proxy_pass http://192.168.1.10:8090; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
    location /schemas/          { proxy_pass http://192.168.1.10:8090; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }

    # Imprint static marketing (wrx1 native nginx :8153)
    location / {
        proxy_pass http://192.168.1.10:8153;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120;
    }
}
