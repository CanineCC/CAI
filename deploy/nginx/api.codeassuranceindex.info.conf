# dgx1 TLS edge vhost — api.codeassuranceindex.info → canine-wrx1 :8090 (the SAME cai-web service
# the app host uses; the registry lives inside Cai.Web under /api/registry, so this is a second
# hostname on the existing backend, not a new service).
#
# Replaces api.cai.canine.dev, which is kept only as a 301 so programmatic callers pinned to the old
# name keep working. This file is a copy of what is installed and live.
# Install: /etc/nginx/sites-available/api.codeassuranceindex.info + symlink into sites-enabled.
# Cert (webroot):
#   sudo certbot certonly --webroot -w /var/www/html -d api.codeassuranceindex.info
# DNS resolves via the wildcard *.codeassuranceindex.info → the apex A record (5.103.135.44).
server {
    listen 80;
    listen [::]:80;
    server_name api.codeassuranceindex.info;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.codeassuranceindex.info;
    ssl_certificate /etc/letsencrypt/live/api.codeassuranceindex.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.codeassuranceindex.info/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 16m;
    location / {
        proxy_pass http://192.168.1.10:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120;
    }
}
