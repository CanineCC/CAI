# systemd drop-in for cai-web-preprod.service — registry PRINCIPALS (bearer credentials).
# Mirrors /etc/systemd/system/cai-web.service.d/registry.conf on the production unit.
#
# WHY: preprod had no drop-in at all, so Registry:Principals was empty and every authenticated
# registry call answered 401. The tier could serve rubrics, digests and its key set, but could never
# accept a PUBLISHED delivery — so the write half of the standard was never rehearsed before prod.
# Its trusted-key half was already configured (registry-data/trusted-keys.json, kennel-preprod active).
#
# SECRETS: Registry__Principals__* live in the 0600 env file below, never in this drop-in
# (drop-ins are world-readable). "-" = optional, so the service still boots if it is absent —
# which is exactly why this gap was silent.
#
# NO DbPath/KeysPath HERE, unlike the prod drop-in beside this file: cai-web-preprod.service already
# carries both as Environment= lines in the unit itself, pointing at its own registry-data dir. This
# drop-in therefore adds exactly one thing — the credential file — and a future edit should check the
# unit before duplicating a path into here, because a drop-in silently wins over the unit.
#
# Install as /etc/systemd/system/cai-web-preprod.service.d/registry.conf (then: systemctl daemon-reload;
# takes effect on the next restart of the service).
#
# ROLLBACK: sudo rm -r /etc/systemd/system/cai-web-preprod.service.d && sudo systemctl daemon-reload
[Service]
EnvironmentFile=-/home/jimmy/.config/cai/registry-preprod.env
